<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bgGradient)"/>
  <!-- Bot head -->
  <rect x="28" y="20" width="44" height="40" rx="4" fill="#ffffff" opacity="0.95"/>
  <!-- Eyes -->
  <circle cx="38" cy="32" r="4" fill="#4f46e5"/>
  <circle cx="62" cy="32" r="4" fill="#4f46e5"/>
  <!-- Mouth -->
  <path d="M 38 42 Q 50 46 62 42" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="30" y="62" width="40" height="28" rx="3" fill="#ffffff" opacity="0.95"/>
  <!-- Arms -->
  <rect x="16" y="70" width="12" height="8" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="72" y="70" width="12" height="8" rx="2" fill="#ffffff" opacity="0.9"/>
  <!-- Antenna -->
  <line x1="42" y1="20" x2="38" y2="8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="6" r="2.5" fill="#ffffff"/>
</svg>
